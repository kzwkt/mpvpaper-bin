name:   build
on:
  push:
    paths:
      - 'builder' 

jobs:
  debian-container:
    runs-on: ubuntu-latest
    container: debian:stable
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: clone audacious repo
        run: |
              apt-get update 
              apt-get install -y --no-install-recommends gcc binutils g++  automake   meson  pkg-config git libmpv-dev libwlroots-dev
              git clone --single-branch https://github.com/GhostNaN/mpvpaper
              cd mpvpaper
              meson setup build --prefix=/usr/local
              ninja -C build
              strip build/mpvpaper
              strip build/mpvpaper-holder
              echo "FILE1=$(realpath build/mpvpaper)" >> $GITHUB_ENV
              echo "FILE2=$(realpath build/mpvpaper-holder)" >> $GITHUB_ENV
              
            
              
      - name: Create GitHub Release and Upload ZIP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: |
            ${{ env.FILE1 }}
            ${{ env.FILE2 }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
